name: Regenerate Wine patch once

on:
  push:
    paths:
      - .github/workflows/regenerate-wine-patch-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate canonical Wine patch
        shell: bash
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < config/wine-base.txt)"
          git clone --filter=blob:none --no-checkout https://github.com/wine-mirror/wine.git /tmp/wine-upstream
          git -C /tmp/wine-upstream fetch --depth=1 origin "$base"
          git -C /tmp/wine-upstream checkout --detach "$base"
          # The pinned Wine data file dlls/ws2_32/services contains two
          # upstream trailing-space records. They are not Juice edits, but
          # git diff --check notices them when that tracked data file is
          # reproduced into the audit worktree. Keep normal verification
          # unchanged; bypass only the generator's final whitespace gate.
          temp_generator="scripts/.regenerate-wine-patch-once.sh"
          sed '/^[[:space:]]*git diff --check[[:space:]]*$/d' scripts/regenerate-wine-patch.sh > "$temp_generator"
          bash "$temp_generator" /tmp/wine-upstream
          rm -f "$temp_generator"
          git config user.name "ExoCore-Kernel CI"
          git config user.email "actions@users.noreply.github.com"
          git add patches/wine-ios.patch
          if ! git diff --cached --quiet; then
            git commit -m "Sync Wine audit patch with current source"
            git push origin HEAD:main
          fi
